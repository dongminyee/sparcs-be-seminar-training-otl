name: mini-otl
services:
  mysql:
    image: mysql:8.4
    ports:
      - "127.0.0.1:${MYSQL_PORT}:3306"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mysql --protocol=TCP -h 127.0.0.1 -u "$$MYSQL_USER" --password="$$MYSQL_PASSWORD" "$$MYSQL_DATABASE" -e ''SELECT 1'' >/dev/null 2>&1',
        ]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db/01-shadow.sql:/docker-entrypoint-initdb.d/01-shadow.sql:ro

volumes:
  mysql-data:
